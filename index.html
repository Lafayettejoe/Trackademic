<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trackademic — Student Grade Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --primary: #1A56DB;
  --primary-dark: #0F3B8E;
  --primary-light: #EBF2FF;
  --primary-50: #EFF6FF;
  --success: #0E9F6E;
  --success-light: #D1FAE5;
  --success-dark: #065F46;
  --warning: #F59E0B;
  --warning-light: #FEF3C7;
  --warning-dark: #92400E;
  --danger: #E02424;
  --danger-light: #FEE2E2;
  --danger-dark: #991B1B;
  --slate-900: #0F172A;
  --slate-800: #1E293B;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748B;
  --slate-400: #94A3B8;
  --slate-300: #CBD5E1;
  --slate-200: #E2E8F0;
  --slate-100: #F1F5F9;
  --slate-50: #F8FAFC;
  --white: #FFFFFF;
  --sidebar-bg: #0F172A;
  --sidebar-hover: #1E293B;
  --sidebar-active: #1A56DB;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
  --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
  --sidebar-width: 240px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--slate-800);
  background: var(--slate-50);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  line-height: 1.6;
}

a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: inherit; }
input, select { font-family: inherit; }

/* ===== LANDING PAGE ===== */
.landing {
  min-height: 100vh;
  background: var(--white);
}

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem 1.5rem;
  position: relative;
  background: linear-gradient(135deg, #0F172A 0%, #1A56DB 50%, #0F3B8E 100%);
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(26, 86, 219, 0.3), transparent),
    radial-gradient(ellipse 50% 30% at 80% 80%, rgba(14, 159, 110, 0.15), transparent),
    radial-gradient(ellipse 40% 30% at 20% 70%, rgba(245, 158, 11, 0.1), transparent);
  pointer-events: none;
}

.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 1;
  max-width: 720px;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 0.4rem 1rem;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--slate-300);
  margin-bottom: 1.5rem;
}

.hero-badge span {
  color: var(--white);
}

.hero h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(2.8rem, 7vw, 4.5rem);
  font-weight: 700;
  color: var(--white);
  line-height: 1.1;
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
}

.hero h1 span {
  background: linear-gradient(135deg, #60A5FA, #34D399);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  font-size: clamp(1.05rem, 2vw, 1.25rem);
  color: var(--slate-300);
  max-width: 540px;
  margin: 1rem auto 2rem;
  line-height: 1.7;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: center;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 2rem;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 0.95rem;
  border: none;
  background: var(--white);
  color: var(--primary-dark);
  transition: all 0.2s;
  box-shadow: var(--shadow-md);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 2rem;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.95rem;
  border: 2px solid rgba(255,255,255,0.3);
  background: transparent;
  color: var(--white);
  transition: all 0.2s;
}

.btn-ghost:hover {
  border-color: var(--white);
  background: rgba(255,255,255,0.08);
}

.hero-stats-row {
  display: flex;
  gap: 2.5rem;
  justify-content: center;
  margin-top: 3rem;
}

.hero-stat {
  text-align: center;
}

.hero-stat-num {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--white);
  font-feature-settings: "tnum";
}

.hero-stat-label {
  font-size: 0.8rem;
  color: var(--slate-400);
  font-weight: 500;
  margin-top: 0.15rem;
}

.scroll-indicator {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  color: var(--slate-400);
  animation: bounceDown 2s infinite;
}

@keyframes bounceDown {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* Sections shared */
.section {
  padding: 5rem 1.5rem;
  max-width: 1100px;
  margin: 0 auto;
}

.section-label {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.section-title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(2rem, 4vw, 2.8rem);
  font-weight: 700;
  color: var(--slate-900);
  line-height: 1.2;
  margin-bottom: 1rem;
}

.section-desc {
  font-size: 1.05rem;
  color: var(--slate-500);
  max-width: 600px;
  line-height: 1.7;
}

.features-header {
  text-align: center;
  margin-bottom: 3.5rem;
}

.features-header .section-desc {
  margin: 0 auto;
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
}

.feature-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 2rem;
  transition: all 0.25s;
}

.feature-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-lg);
  transform: translateY(-4px);
}

.feature-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  background: var(--primary-50);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  margin-bottom: 1.25rem;
}

.feature-card h3 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--slate-900);
  margin-bottom: 0.5rem;
}

.feature-card p {
  font-size: 0.9rem;
  color: var(--slate-500);
  line-height: 1.6;
}

.how-section {
  background: var(--slate-50);
}

.how-header {
  text-align: center;
  margin-bottom: 3.5rem;
}

.how-header .section-desc {
  margin: 0 auto;
}

.how-steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 2rem;
  counter-reset: step;
}

.how-step {
  text-align: center;
  counter-increment: step;
}

.how-step-num {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--white);
  font-size: 1.3rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.25rem;
}

.how-step h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--slate-900);
  margin-bottom: 0.4rem;
}

.how-step p {
  font-size: 0.9rem;
  color: var(--slate-500);
  line-height: 1.6;
}

.testimonials-section {
  text-align: center;
}

.testimonials-header {
  margin-bottom: 3rem;
}

.testimonials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
  text-align: left;
}

.testimonial-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1.75rem;
}

.testimonial-stars {
  color: var(--warning);
  font-size: 1rem;
  margin-bottom: 0.75rem;
}

.testimonial-card blockquote {
  font-size: 0.9rem;
  color: var(--slate-600);
  line-height: 1.7;
  font-style: italic;
  margin-bottom: 1rem;
}

.testimonial-author {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--slate-900);
}

.cta-banner {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
  border-radius: var(--radius-xl);
  padding: 4rem 2rem;
  text-align: center;
  max-width: 1100px;
  margin: 0 auto 5rem;
  position: relative;
  overflow: hidden;
}

.cta-banner::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,255,255,0.08), transparent);
  pointer-events: none;
}

.cta-banner h2 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.8rem, 3vw, 2.5rem);
  color: var(--white);
  margin-bottom: 1rem;
  position: relative;
}

.cta-banner p {
  color: var(--slate-300);
  font-size: 1.05rem;
  margin-bottom: 2rem;
  position: relative;
}

.cta-banner .btn-primary {
  position: relative;
}

.landing-footer {
  border-top: 1px solid var(--slate-200);
  padding: 2.5rem 1.5rem;
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}

.landing-footer .footer-brand {
  font-family: 'DM Serif Display', serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--primary);
}

.landing-footer .footer-links {
  display: flex;
  gap: 1.5rem;
  font-size: 0.85rem;
  color: var(--slate-500);
}

.landing-footer .footer-links a:hover {
  color: var(--slate-800);
}

.landing-footer .footer-copy {
  font-size: 0.8rem;
  color: var(--slate-400);
}

/* ===== AUTH PAGES ===== */
.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  background: linear-gradient(135deg, var(--slate-50) 0%, var(--primary-50) 100%);
}

.auth-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-xl);
  padding: 2.5rem;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-lg);
}

.auth-logo {
  font-family: 'DM Serif Display', serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary);
  text-align: center;
  margin-bottom: 0.25rem;
}

.auth-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--slate-900);
  text-align: center;
  margin-bottom: 0.35rem;
}

.auth-sub {
  font-size: 0.9rem;
  color: var(--slate-500);
  text-align: center;
  margin-bottom: 1.75rem;
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--slate-700);
  margin-bottom: 0.35rem;
}

.form-group input[type="text"],
.form-group input[type="email"],
.form-group input[type="password"],
.form-group input[type="number"],
.form-group select {
  width: 100%;
  padding: 0.7rem 0.9rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  color: var(--slate-800);
  background: var(--white);
  transition: all 0.15s;
  outline: none;
}

.form-group input:focus,
.form-group select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}

.form-group input.input-error {
  border-color: var(--danger);
}

.form-error {
  font-size: 0.72rem;
  color: var(--danger);
  margin-top: 0.25rem;
  font-weight: 500;
}

.btn-submit {
  width: 100%;
  padding: 0.8rem;
  border: none;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--white);
  font-weight: 700;
  font-size: 0.95rem;
  transition: all 0.15s;
  margin-top: 0.5rem;
}

.btn-submit:hover {
  background: var(--primary-dark);
}

.btn-submit:active {
  transform: scale(0.98);
}

.auth-switch {
  text-align: center;
  font-size: 0.85rem;
  color: var(--slate-500);
  margin-top: 1.25rem;
}

.auth-switch a {
  color: var(--primary);
  font-weight: 600;
}

.auth-switch a:hover {
  text-decoration: underline;
}

/* ===== ONBOARDING ===== */
.onboarding-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  background: linear-gradient(135deg, var(--slate-50) 0%, var(--primary-50) 100%);
}

.onboarding-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-xl);
  padding: 2.5rem;
  width: 100%;
  max-width: 520px;
  box-shadow: var(--shadow-lg);
}

.onboarding-progress {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  margin-bottom: 2rem;
}

.onboarding-progress .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--slate-200);
  transition: all 0.3s;
}

.onboarding-progress .dot.active {
  background: var(--primary);
  transform: scale(1.3);
}

.onboarding-progress .dot.done {
  background: var(--success);
}

.onboarding-actions {
  display: flex;
  gap: 0.75rem;
  margin-top: 1.5rem;
}

.btn-back {
  padding: 0.7rem 1.2rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-md);
  background: var(--white);
  color: var(--slate-600);
  font-weight: 600;
  font-size: 0.85rem;
  transition: all 0.15s;
}

.btn-back:hover {
  border-color: var(--slate-300);
  background: var(--slate-50);
}

/* ===== SEARCHABLE SELECT ===== */
.searchable-select {
  position: relative;
}

.searchable-select input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  color: var(--slate-800);
  background: var(--white);
  outline: none;
  transition: border-color 0.15s;
}

.searchable-select input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}

.searchable-select .dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  max-height: 200px;
  overflow-y: auto;
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  z-index: 100;
  display: none;
  margin-top: 4px;
}

.searchable-select .dropdown.open {
  display: block;
}

.searchable-select .dropdown-item {
  padding: 0.55rem 0.75rem;
  font-size: 0.85rem;
  color: var(--slate-700);
  cursor: pointer;
  transition: background 0.1s;
}

.searchable-select .dropdown-item:hover,
.searchable-select .dropdown-item.highlighted {
  background: var(--primary-50);
}

.searchable-select .dropdown-item.selected {
  background: var(--primary-light);
  font-weight: 600;
  color: var(--primary);
}

.searchable-select .no-results {
  padding: 0.75rem;
  font-size: 0.8rem;
  color: var(--slate-400);
  text-align: center;
}

/* ===== DASHBOARD LAYOUT ===== */
.dashboard-layout {
  display: flex;
  min-height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: var(--white);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 1000;
  overflow-y: auto;
}

.sidebar-brand {
  padding: 1.25rem 1.25rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.sidebar-brand a {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'DM Serif Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--white);
}

.sidebar-nav {
  flex: 1;
  padding: 0.75rem 0;
}

.sidebar-nav-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1.25rem;
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--slate-400);
  transition: all 0.15s;
  border-left: 3px solid transparent;
  width: 100%;
  border: none;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.sidebar-nav-item:hover {
  background: var(--sidebar-hover);
  color: var(--slate-200);
}

.sidebar-nav-item.active {
  background: rgba(26, 86, 219, 0.15);
  color: var(--white);
  border-left-color: var(--sidebar-active);
}

.sidebar-divider {
  height: 1px;
  background: rgba(255,255,255,0.06);
  margin: 0.5rem 1.25rem;
}

.sidebar-footer {
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 0.75rem 1.25rem;
}

.sidebar-user {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  width: 100%;
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  padding: 0;
  color: inherit;
}

.sidebar-user-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--sidebar-active);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--white);
  flex-shrink: 0;
}

.sidebar-user-info {
  overflow: hidden;
}

.sidebar-user-name {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--white);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-user-school {
  font-size: 0.7rem;
  color: var(--slate-400);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== MAIN CONTENT ===== */
.main-content {
  flex: 1;
  margin-left: var(--sidebar-width);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background: var(--white);
  border-bottom: 1px solid var(--slate-200);
  position: sticky;
  top: 0;
  z-index: 100;
}

.main-header-left h2 {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--slate-900);
}

.main-header-left p {
  font-size: 0.8rem;
  color: var(--slate-400);
  margin-top: 0.1rem;
}

.main-header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.school-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.35rem 0.75rem;
  background: var(--primary-50);
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--primary);
}

.main-body {
  flex: 1;
  padding: 1.5rem 2rem 3rem;
}

/* ===== OVERVIEW PAGE ===== */
.overview-greeting {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--slate-600);
  margin-bottom: 0.15rem;
}

.wave-emoji {
  display: inline-block;
  animation: wave 1.5s ease-in-out infinite;
  transform-origin: 70% 70%;
}

@keyframes wave {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(15deg); }
  50% { transform: rotate(-8deg); }
  75% { transform: rotate(12deg); }
}

.overview-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  margin: 1.5rem 0;
}

.overview-stat-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;
  transition: all 0.2s;
}

.overview-stat-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.overview-stat-card.cgpa-card {
  border-left: 4px solid var(--primary);
}

.overview-stat-card.card-first {
  border-left-color: var(--success);
}

.overview-stat-card.card-upper {
  border-left-color: var(--primary);
}

.overview-stat-card.card-lower {
  border-left-color: var(--warning);
}

.ov-stat-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}

.overview-stat-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--slate-400);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.overview-stat-value {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--slate-900);
  font-feature-settings: "tnum";
  line-height: 1.2;
}

.overview-stat-sub {
  font-size: 0.72rem;
  color: var(--slate-400);
  margin-top: 0.1rem;
}

.overview-two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1rem;
}

.info-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  transition: box-shadow 0.2s;
}

.info-card:hover {
  box-shadow: var(--shadow-md);
}

.info-card-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--slate-700);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

/* Progress card */
.progress-section {
  margin-bottom: 1rem;
}

.progress-bar-track {
  height: 10px;
  background: var(--slate-100);
  border-radius: 999px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.8s ease;
}

.progress-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 0.2rem;
  font-size: 0.65rem;
  color: var(--slate-400);
}

.progress-msg {
  font-size: 0.78rem;
  color: var(--slate-500);
  margin-top: 0.4rem;
  font-weight: 500;
}

.success-msg {
  color: var(--success);
}

/* Bar chart */
.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 0.5rem;
  height: 120px;
}

.bar-chart-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
  height: 100%;
  justify-content: flex-end;
}

.bar-chart-bar-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.bar-chart-bar {
  width: 60%;
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  transition: height 0.6s ease;
  position: relative;
}

.bar-chart-bar.empty {
  background: var(--slate-200);
  height: 8px !important;
}

.bar-chart-value {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--slate-500);
  font-feature-settings: "tnum";
}

.bar-chart-label {
  font-size: 0.6rem;
  color: var(--slate-400);
  font-weight: 500;
  text-align: center;
  white-space: nowrap;
}

/* Grade distribution pie */
.grade-dist {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.dist-pie {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
}

.dist-pie-center {
  position: absolute;
  inset: 20%;
  background: var(--white);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--slate-600);
}

.dist-legend {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.dist-legend-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.78rem;
  color: var(--slate-600);
}

.dist-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dist-label {
  font-weight: 500;
  flex: 1;
}

.dist-count {
  font-feature-settings: "tnum";
  color: var(--slate-400);
}

.dist-pct {
  font-weight: 700;
  color: var(--slate-700);
  min-width: 36px;
  text-align: right;
  font-feature-settings: "tnum";
}

/* Info card rows */
.info-card-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--slate-100);
}

.info-card-row:last-child {
  border-bottom: none;
}

.info-card-row-label {
  font-size: 0.8rem;
  color: var(--slate-500);
}

.info-card-row-value {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--slate-800);
  font-feature-settings: "tnum";
}

/* Achievements */
.achievement-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.6rem;
}

.achievement-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem;
  background: var(--slate-50);
  border-radius: var(--radius-sm);
  transition: background 0.15s;
}

.achievement-item:hover {
  background: var(--primary-50);
}

.achievement-icon {
  font-size: 1.2rem;
  width: 28px;
  text-align: center;
}

.achievement-info {
  flex: 1;
}

.achievement-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--slate-700);
}

.achievement-desc {
  font-size: 0.65rem;
  color: var(--slate-400);
}

/* Quote card */
.quote-card {
  background: linear-gradient(135deg, var(--slate-50), var(--primary-50));
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  margin: 1rem 0 0;
}

.quote-icon {
  font-size: 1.5rem;
  flex-shrink: 0;
  color: var(--primary);
  opacity: 0.6;
}

.quote-card blockquote p {
  font-size: 0.85rem;
  font-style: italic;
  color: var(--slate-600);
  line-height: 1.6;
}

/* Quick actions bar */
.quick-actions-bar {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 1rem;
}

.quick-actions-bar-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--slate-500);
  white-space: nowrap;
}

.quick-actions-bar-btns {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.qa-btn {
  padding: 0.45rem 0.9rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-sm);
  background: var(--white);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--slate-600);
  transition: all 0.15s;
}

.qa-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-50);
}

/* ===== CGPA TRACKER / GRADE TRACKER ===== */

/* Cards row (auto-fill grid) */
.gt-cards-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}

.gt-cards-row-3 {
  grid-template-columns: repeat(3, 1fr);
}

.gt-card-semesters {
  grid-column: 1 / -1;
}

#stats-header {
  grid-column: 1 / -1;
  width: 100%;
}

/* Generic card */
.gt-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  transition: box-shadow 0.2s;
}

.gt-card:hover {
  box-shadow: var(--shadow-md);
}

.gt-card-header {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--slate-800);
  margin-bottom: 0.75rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--slate-100);
}

/* Card stats grid */
.gt-card-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
}

.gt-card-stat {
  text-align: center;
  padding: 0.4rem 0;
}

.gt-card-stat-label {
  display: block;
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--slate-400);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.15rem;
}

.gt-card-stat-val {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--slate-900);
  font-feature-settings: "tnum";
}

/* Grade distribution bar */
.gt-dist-bar {
  display: flex;
  height: 32px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 0.4rem;
}

.gt-dist-seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--white);
  transition: flex 0.3s;
  min-width: 28px;
}

.gt-dist-seg span {
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

.gt-dist-total {
  font-size: 0.7rem;
  color: var(--slate-400);
  font-weight: 600;
}

/* Grade class badge */
.gt-class-badge {
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 700;
}

/* What-If */
.gt-whatif-desc {
  font-size: 0.8rem;
  color: var(--slate-400);
  margin-bottom: 0.6rem;
  line-height: 1.4;
}

.gt-whatif-inline {
  display: flex;
  gap: 0.5rem;
  align-items: flex-end;
}

.gt-whatif-field {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  flex: 1;
}

.gt-whatif-field label {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--slate-500);
}

.gt-whatif-field input,
.gt-whatif-field select {
  padding: 0.45rem 0.6rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-family: inherit;
  color: var(--slate-800);
  background: var(--white);
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}

.gt-whatif-field input:focus,
.gt-whatif-field select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-light);
}

.gt-whatif-btn {
  padding: 0.45rem 1rem;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: var(--white);
  font-weight: 700;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
  min-height: 36px;
}

.gt-whatif-btn:hover {
  background: var(--primary-dark);
}

.gt-whatif-result {
  margin-top: 0.5rem;
}

.whatif-result-card {
  background: var(--slate-50);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-sm);
  padding: 0.65rem 0.75rem;
}

.whatif-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.2rem 0;
  font-size: 0.8rem;
  color: var(--slate-600);
}

.whatif-val {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--slate-800);
  font-feature-settings: "tnum";
}

.whatif-up { color: var(--success); }
.whatif-down { color: var(--danger); }

.whatif-grade {
  font-size: 0.75rem;
  padding: 0.1rem 0.45rem;
  border-radius: 999px;
  font-weight: 700;
  color: var(--white);
}

/* GT Mini card (stats-header container) */
.gt-card-mini {
  min-height: 80px;
}

/* ===== SEMESTER GRID ===== */
.gt-sem-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.65rem;
}

.gt-sem-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
  padding: 0.65rem 0.35rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-md);
  background: var(--white);
  cursor: pointer;
  transition: all 0.15s;
}

.gt-sem-btn:hover {
  border-color: var(--primary);
  background: var(--primary-50);
}

.gt-sem-btn.active {
  border-color: var(--primary);
  background: var(--primary-light);
  box-shadow: 0 0 0 2px var(--primary-light);
}

.gt-sem-label {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--slate-500);
}

.gt-sem-gpa {
  font-size: 1rem;
  font-weight: 800;
  color: var(--slate-900);
  font-feature-settings: "tnum";
}

.gt-sem-btn.active .gt-sem-gpa {
  color: var(--primary);
}

/* ===== COURSE FORM ===== */
.form-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-top: 0;
}

.form-row {
  display: flex;
  gap: 0.75rem;
  align-items: flex-end;
}

.form-row .form-group {
  flex: 1;
  min-width: 0;
  margin-bottom: 0;
}

.credit-unit-label {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--slate-500);
  margin-bottom: 0.25rem;
}

.credit-unit-group {
  display: flex;
  gap: 0.35rem;
}

.cu-btn {
  flex: 1;
  padding: 0.5rem 0;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-sm);
  background: var(--white);
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--slate-500);
  cursor: pointer;
  transition: all 0.12s;
  text-align: center;
}

.cu-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.cu-btn.active {
  border-color: var(--primary);
  background: var(--primary);
  color: var(--white);
}

.btn-add {
  padding: 0.6rem 1.5rem;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: var(--white);
  font-weight: 700;
  font-size: 0.85rem;
  transition: background 0.15s;
  white-space: nowrap;
  height: 38px;
}

.btn-add:hover {
  background: var(--primary-dark);
}

/* ===== COURSE TABLE ===== */
.table-wrapper {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-top: 1rem;
}

.empty-state {
  text-align: center;
  padding: 2.5rem 1.5rem;
}

.empty-state-icon {
  font-size: 2.5rem;
  margin-bottom: 0.75rem;
  opacity: 0.5;
}

.empty-state p {
  font-size: 0.85rem;
  color: var(--slate-400);
}

.course-table {
  width: 100%;
  border-collapse: collapse;
}

.course-table th {
  padding: 0.7rem 0.75rem;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--slate-500);
  background: var(--slate-50);
  text-align: left;
  border-bottom: 1px solid var(--slate-200);
}

.course-table td {
  padding: 0.65rem 0.75rem;
  font-size: 0.85rem;
  color: var(--slate-700);
  border-bottom: 1px solid var(--slate-100);
}

.course-table tr:last-child td {
  border-bottom: none;
}

.course-row {
  transition: background 0.15s;
}

.course-row:hover {
  background: var(--slate-50);
}

.course-row.deleting {
  opacity: 0.3;
  pointer-events: none;
}

.grade-pill {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
}

.grade-pill-A { background: var(--success-light); color: var(--success-dark); }
.grade-pill-B { background: var(--primary-light); color: var(--primary-dark); }
.grade-pill-C { background: var(--warning-light); color: var(--warning-dark); }
.grade-pill-D { background: #FED7AA; color: #9A3412; }
.grade-pill-E { background: var(--danger-light); color: var(--danger-dark); }
.grade-pill-F { background: #FECACA; color: var(--danger-dark); }

.delete-btn {
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--danger-light);
  border-radius: var(--radius-sm);
  background: var(--white);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--danger);
  cursor: pointer;
  transition: all 0.12s;
}

.delete-btn:hover {
  background: var(--danger-light);
  color: var(--danger-dark);
}

/* ===== SEMESTER SUMMARY ===== */
#semester-summary {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  display: flex;
  gap: 2rem;
  margin-top: 1rem;
}

#semester-summary:empty {
  display: none;
}

.summary-item {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}

.summary-label {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--slate-400);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.summary-value {
  font-size: 1rem;
  font-weight: 800;
  color: var(--slate-900);
  font-feature-settings: "tnum";
}

/* ===== STATS HEADER (renderGTStats) ===== */
#stats-header .stats-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 1rem;
}

#stats-header .stat-item {
  text-align: center;
}

#stats-header .stat-label {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--slate-400);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: block;
  margin-bottom: 0.1rem;
}

#stats-header .stat-value {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--slate-900);
  font-feature-settings: "tnum";
  line-height: 1.2;
}

#stats-header .stat-sub {
  font-size: 0.65rem;
  color: var(--slate-400);
}

/* Badges */
#stats-header .badge-green,
#stats-header .badge-blue,
#stats-header .badge-yellow,
#stats-header .badge-orange,
#stats-header .badge-gray,
#stats-header .badge-red {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 700;
}

#stats-header .badge-green { background: var(--success-light); color: var(--success-dark); }
#stats-header .badge-blue { background: var(--primary-light); color: var(--primary-dark); }
#stats-header .badge-yellow { background: var(--warning-light); color: var(--warning-dark); }
#stats-header .badge-orange { background: #FED7AA; color: #9A3412; }
#stats-header .badge-gray { background: var(--slate-100); color: var(--slate-600); }
#stats-header .badge-red { background: var(--danger-light); color: var(--danger-dark); }

/* Progress bar inside stats-header */
#stats-header .progress-track {
  height: 6px;
  background: var(--slate-100);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 0.2rem;
}

#stats-header .progress-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.5s ease;
}

/* ===== OVERVIEW GRID (for old overview) */
.overview-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 1rem;
  margin-top: 1rem;
}

const GRADE_MAP = [
  { min: 70, max: 100, letter: 'A', point: 5 },
  { min: 60, max: 69, letter: 'B', point: 4 },
  { min: 50, max: 59, letter: 'C', point: 3 },
  { min: 45, max: 49, letter: 'D', point: 2 },
  { min: 40, max: 44, letter: 'E', point: 1 },
  { min: 0,  max: 39, letter: 'F', point: 0 },
];

const STORAGE_KEY = 'trackademic-data';

/* ===== GRADING LOGIC ===== */
function getGrade(score) {
  const clamped = Math.round(score);
  return GRADE_MAP.find(g => clamped >= g.min && clamped <= g.max);
}

function calcQualityPoints(course) {
  const grade = getGrade(course.score);
  return grade.point * course.creditUnits;
}

function calcGPA(courses) {
  if (!courses || courses.length === 0) return null;
  const totalQP = courses.reduce((sum, c) => sum + calcQualityPoints(c), 0);
  const totalCU = courses.reduce((sum, c) => sum + c.creditUnits, 0);
  if (totalCU === 0) return null;
  return totalQP / totalCU;
}

function calcCGPA(semesters) {
  const allCourses = Object.values(semesters).flat();
  if (allCourses.length === 0) return null;
  const totalQP = allCourses.reduce((sum, c) => sum + calcQualityPoints(c), 0);
  const totalCU = allCourses.reduce((sum, c) => sum + c.creditUnits, 0);
  if (totalCU === 0) return null;
  return totalQP / totalCU;
}

function getDegreeClass(cgpa) {
  if (cgpa === null || cgpa === undefined) return null;
  if (cgpa >= 4.50) return { label: 'First Class', color: 'green' };
  if (cgpa >= 3.50) return { label: '2nd Class Upper', color: 'blue' };
  if (cgpa >= 2.40) return { label: '2nd Class Lower', color: 'yellow' };
  if (cgpa >= 1.50) return { label: 'Third Class', color: 'orange' };
  if (cgpa >= 1.00) return { label: 'Pass', color: 'gray' };
  return { label: 'Fail', color: 'red' };
}

function getProgressBarColor(cgpa) {
  if (cgpa === null || cgpa === undefined) return 'var(--slate-600)';
  if (cgpa >= 4.50) return 'var(--success)';
  if (cgpa >= 3.50) return 'var(--primary)';
  if (cgpa >= 2.40) return 'var(--warning)';
  return 'var(--danger)';
}

function formatGPA(value) {
  if (value === null || value === undefined) return '\u2014';
  return value.toFixed(2);
}

  } catch {}
}

function loadState() {
  try {

    if (raw) {

      state.school = parsed.school || null;
      state.department = parsed.department || null;
      state.semesters = parsed.semesters || createInitialSemesters();
      state.activeSemester = parsed.activeSemester || '100L S1';
    }
  } catch {}
}

function clearState() {
  localStorage.removeItem(STORAGE_KEY);
  state = { ...DEFAULT_STATE, semesters: createInitialSemesters() };
}

/* ===== SEARCHABLE SELECT ===== */
function setupSearchableSelect(inputId, dropdownId, items, displayId) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  let selectedValue = '';
  let highlightedIdx = -1;
  let filteredItems = [...items];

  function openDropdown() {
    dropdown.classList.add('open');
  }

  function closeDropdown() {
    dropdown.classList.remove('open');
    highlightedIdx = -1;
  }

  function renderDropdown(filter) {
    const q = filter.toLowerCase().trim();
    filteredItems = q ? items.filter(item => item.toLowerCase().includes(q)) : items;
    if (filteredItems.length === 0) {
      dropdown.innerHTML = '<div class="no-results">No results found. Try a different search.</div>';
    } else {
      dropdown.innerHTML = filteredItems.map((item, idx) => {
        const cls = idx === highlightedIdx ? 'dropdown-item highlighted' : 'dropdown-item';
        const sel = item === selectedValue ? ' selected' : '';
        return `<div class="${cls}${sel}" data-value="${item}">${item}</div>`;
      }).join('');
    }
    openDropdown();
  }

  input.addEventListener('input', () => {
    selectedValue = '';
    const display = document.getElementById(displayId);
    if (display) display.innerHTML = '';
    document.getElementById('error-school') && (document.getElementById('error-school').textContent = '');
    document.getElementById('error-dept') && (document.getElementById('error-dept').textContent = '');
    renderDropdown(input.value);
  });

  input.addEventListener('focus', () => {
    renderDropdown(input.value);
  });

  input.addEventListener('blur', () => {
    setTimeout(closeDropdown, 200);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      highlightedIdx = Math.min(highlightedIdx + 1, filteredItems.length - 1);
      renderDropdown(input.value);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      highlightedIdx = Math.max(highlightedIdx - 1, -1);
      renderDropdown(input.value);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (highlightedIdx >= 0 && highlightedIdx < filteredItems.length) {
        selectItem(filteredItems[highlightedIdx]);
      }
    }
  });

  dropdown.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.dropdown-item');
    if (item) {
      selectItem(item.dataset.value);
    }
  });

  function selectItem(value) {
    selectedValue = value;
    input.value = value;
    const display = document.getElementById(displayId);
    if (display) {
      display.innerHTML = `<div class="selected-item">${ICONS.check} ${value}</div>`;
    }
    closeDropdown();
    const errInput = inputId === 'school-search' ? 'error-school' : 'error-dept';
    const err = document.getElementById(errInput);
    if (err) err.textContent = '';
  }

  renderDropdown('');
}

function handleSignup(e) {
  e.preventDefault();
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  let valid = true;

  const errName = document.getElementById('error-signup-name');
  const errEmail = document.getElementById('error-signup-email');
  const errPass = document.getElementById('error-signup-password');

  if (!name) { errName.textContent = 'Please enter your name'; document.getElementById('signup-name').classList.add('input-error'); valid = false; }
  else { errName.textContent = ''; document.getElementById('signup-name').classList.remove('input-error'); }

  if (!email || !email.includes('@')) { errEmail.textContent = 'Please enter a valid email'; document.getElementById('signup-email').classList.add('input-error'); valid = false; }
  else { errEmail.textContent = ''; document.getElementById('signup-email').classList.remove('input-error'); }

  if (!password || password.length < 6) { errPass.textContent = 'Password must be at least 6 characters'; document.getElementById('signup-password').classList.add('input-error'); valid = false; }
  else { errPass.textContent = ''; document.getElementById('signup-password').classList.remove('input-error'); }

  if (!valid) return;

  state.user = { name, email, password };
  saveState();
  navigate('onboarding-school');
}

function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const stored = loadStateRaw();
  const errGeneral = document.getElementById('error-login-general');

  if (!stored || !stored.user) {
    errGeneral.textContent = 'No account found. Please sign up first.';
    return;
  }

  if (email !== stored.user.email) {
    errGeneral.textContent = 'No account found with this email.';
    return;
  }

  if (stored.user.password && password !== stored.user.password) {
    errGeneral.textContent = 'Incorrect password. Try again.';
    return;
  }

  state.user = stored.user;
  state.school = stored.school || null;
  state.department = stored.department || null;
  state.semesters = stored.semesters || createInitialSemesters();
  state.activeSemester = stored.activeSemester || '100L S1';

  if (!state.school || !state.department) {
    navigate('onboarding-school');
  } else {
    navigate('dashboard');
  }
}

function loadStateRaw() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

/* ===== GPA TREND HELPERS ===== */
function getSemesterGPA(sem) {
  const courses = state.semesters[sem] || [];
  if (!courses.length) return null;
  const totalQP = courses.reduce((sum, c) => sum + calcQualityPoints(c), 0);
  const totalCU = courses.reduce((sum, c) => sum + c.creditUnits, 0);
  return totalCU > 0 ? totalQP / totalCU : null;
}

function getGradeDistribution(courses) {
  const dist = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 };
  courses.forEach(c => {
    const grade = getGrade(c.score);
    if (grade) dist[grade.letter]++;
  });
  return dist;
}

function getAchievements() {
  const allCourses = Object.values(state.semesters).flat();
  const cgpa = calcCGPA(state.semesters);
  const degree = getDegreeClass(cgpa);
  const items = [];
  if (allCourses.length === 0) return items;
  if (cgpa !== null && cgpa >= 4.50) items.push({ icon: '\uD83C\uDFC6', label: 'First Class Star', desc: 'Outstanding academic performance!' });
  if (allCourses.length >= 30) items.push({ icon: '\uD83D\uDCAA', label: 'Course Crusher', desc: `You've tracked ${allCourses.length} courses!` });
  else if (allCourses.length >= 10) items.push({ icon: '\uD83D\uDCAA', label: 'Getting Serious', desc: `${allCourses.length} courses tracked and counting!` });
  const tracked = SEMESTERS.filter(s => (state.semesters[s] || []).length > 0).length;
  if (tracked >= 6) items.push({ icon: '\uD83D\uDCC8', label: 'Consistency King', desc: `Active across ${tracked} semesters!` });
  else if (tracked >= 3) items.push({ icon: '\uD83D\uDCC8', label: 'On a Roll', desc: `${tracked} semesters with courses!` });
  if (allCourses.length > 0 && cgpa !== null && cgpa < 4.50) items.push({ icon: '\uD83D\uDE80', label: 'On the Rise', desc: 'Every course is a step closer to First Class!' });
  if (degree && degree.label === 'First Class') items.push({ icon: '\uD83C\uDF1F', label: 'Top Performer', desc: 'You\u2019re in the highest degree class!' });
  return items;
}

let prevCGPA = null;
let animFrame = null;

function animateStat(el, targetValue, prevValue) {
  const start = (prevValue !== null && prevValue !== undefined) ? prevValue : 0;
  const diff = targetValue - start;
  const duration = 400;
  const startTime = performance.now();

  function tick(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    el.textContent = formatGPA(start + diff * progress);
    if (progress < 1) animFrame = requestAnimationFrame(tick);
  }
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(tick);
}

function bindCoursesEvents() {
  const formEl = document.getElementById('add-course-form');
  const tableEl = document.getElementById('course-table');

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.gt-sem-btn');
    if (!btn) return;
    const sem = btn.dataset.semester;
    if (sem === state.activeSemester) return;
    state.activeSemester = sem;
    saveState();
    renderForm();
    renderTable();
    renderSummary();
    renderGTStats();
    document.querySelectorAll('.gt-sem-btn').forEach(b => b.classList.toggle('active', b.dataset.semester === sem));
    const sub = document.querySelector('.main-header-left p');
    if (sub) sub.textContent = `Track and calculate your CGPA \u2022 ${sem}`;
    const headerEl = document.querySelector('.gt-card-header');
    if (headerEl) headerEl.textContent = `${sem} \u2014 At a Glance`;
    const activeCourses = state.semesters[sem] || [];
    const activeGPA = calcGPA(activeCourses);
    const semCU = activeCourses.reduce((s, c) => s + c.creditUnits, 0);
    const semQP = activeCourses.reduce((s, c) => s + calcQualityPoints(c), 0);
    const statValEls = document.querySelectorAll('.gt-card-stat-val');
    if (statValEls.length >= 4) {
      statValEls[0].textContent = formatGPA(activeGPA);
      statValEls[1].textContent = activeCourses.length;
      statValEls[2].textContent = semCU;
      statValEls[3].textContent = semQP;
    }
  });

  const whatifBtn = document.getElementById('whatif-btn');
  if (whatifBtn) {
    whatifBtn.addEventListener('click', () => {
      const scoreInput = document.getElementById('whatif-score');
      const cuSelect = document.getElementById('whatif-cu');
      const resultEl = document.getElementById('whatif-result');
      const score = parseInt(scoreInput.value, 10);
      const cu = parseInt(cuSelect.value, 10);
      if (isNaN(score) || score < 0 || score > 100) {
        resultEl.innerHTML = '<span style="color:var(--danger)">Enter a valid score (0\u2013100)</span>';
        return;
      }
      const activeCourses = state.semesters[state.activeSemester] || [];
      const currentQP = activeCourses.reduce((s, c) => s + calcQualityPoints(c), 0);
      const currentCU = activeCourses.reduce((s, c) => s + c.creditUnits, 0);
      const grade = getGrade(score);
      const newQP = currentQP + (grade.point * cu);
      const newCU = currentCU + cu;
      const newGPA = newQP / newCU;
      const currentGPA = currentCU > 0 ? currentQP / currentCU : null;
      const diff = currentGPA !== null ? (newGPA - currentGPA) : newGPA;
      const diffStr = diff >= 0 ? `+${diff.toFixed(2)}` : diff.toFixed(2);
      resultEl.innerHTML = `
        <div class="whatif-result-card">
          <div class="whatif-row">
            <span>New GPA</span>
            <span class="whatif-val">${formatGPA(newGPA)}</span>
          </div>
          <div class="whatif-row">
            <span>Change</span>
            <span class="whatif-val ${diff >= 0 ? 'whatif-up' : 'whatif-down'}">${diffStr}</span>
          </div>
          <div class="whatif-row">
            <span>Grade</span>
            <span class="whatif-grade grade-pill-A">${grade.letter}</span>
          </div>
        </div>
      `;
    });
  }

  if (formEl) {
    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const nameInput = document.getElementById('course-name');
      const scoreInput = document.getElementById('course-score');
      const errName = document.getElementById('error-name');
      const errScore = document.getElementById('error-score');
      const name = nameInput.value.trim();
      const scoreVal = scoreInput.value;
      let valid = true;

      if (!name) {
        errName.textContent = 'Please enter a course name';
        nameInput.classList.add('input-error');
        valid = false;
      } else {
        errName.textContent = '';
        nameInput.classList.remove('input-error');
      }

      if (scoreVal === '' || scoreVal === null || scoreVal === undefined) {
        errScore.textContent = 'Please enter a score';
        scoreInput.classList.add('input-error');
        valid = false;
      } else {
        const n = Number(scoreVal);
        if (isNaN(n) || n < 0 || n > 100) {
          errScore.textContent = 'Score must be between 0 and 100';
          scoreInput.classList.add('input-error');
          valid = false;
        } else {
          errScore.textContent = '';
          scoreInput.classList.remove('input-error');
        }
      }

      if (!valid) return;

      const activeCu = document.querySelector('#cu-group .cu-btn.active');
      const creditUnits = activeCu ? parseInt(activeCu.dataset.cu, 10) : 3;

      const course = {
        id: crypto.randomUUID(),
        name,
        score: Number(scoreVal),
        creditUnits,
      };

      state.semesters[state.activeSemester].push(course);
      saveState();

      nameInput.value = '';
      scoreInput.value = '';
      document.querySelectorAll('#cu-group .cu-btn').forEach(b => b.classList.remove('active'));
      const defaultCu = document.querySelector('#cu-group .cu-btn[data-cu="3"]');
      if (defaultCu) defaultCu.classList.add('active');

      renderTable();
      renderSummary();
      refreshGTCards();
    });

    formEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.cu-btn');
      if (!btn) return;
      document.querySelectorAll('#cu-group .cu-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });

    formEl.addEventListener('input', (e) => {
      const input = e.target;
      if (input.id === 'course-name') {
        const err = document.getElementById('error-name');
        if (input.value.trim()) {
          err.textContent = '';
          input.classList.remove('input-error');
        }
      }
      if (input.id === 'course-score') {
        const err = document.getElementById('error-score');
        const n = Number(input.value);
        if (input.value !== '' && !isNaN(n) && n >= 0 && n <= 100) {
          err.textContent = '';
          input.classList.remove('input-error');
        } else if (input.value !== '') {
          err.textContent = 'Score must be between 0 and 100';
          input.classList.add('input-error');
        } else {
          err.textContent = '';
          input.classList.remove('input-error');
        }
      }
    });
  }

  if (tableEl) {
    tableEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = btn.dataset.id;
      const row = document.querySelector(`.course-table tr[data-id="${id}"]`);
      if (row) {
        row.classList.remove('course-row');
        row.classList.add('deleting');
        setTimeout(() => {
          state.semesters[state.activeSemester] = state.semesters[state.activeSemester].filter(c => c.id !== id);
          saveState();
          renderTable();
          renderSummary();
          refreshGTCards();
        }, 200);
      } else {
        state.semesters[state.activeSemester] = state.semesters[state.activeSemester].filter(c => c.id !== id);
        saveState();
        renderTable();
        renderSummary();
        refreshGTCards();
      }
    });
  }
}

function refreshGTCards() {
  renderGTStats();
  const allCourses = Object.values(state.semesters).flat();
  const dist = getGradeDistribution(allCourses);
  const distTotal = Object.values(dist).reduce((a, b) => a + b, 0);
  const distColors = { A: '#0E9F6E', B: '#1A56DB', C: '#F59E0B', D: '#F97316', E: '#E02424', F: '#991B1B' };

  const distCard = document.querySelector('.gt-cards-row-3 .gt-card:nth-child(2)');
  if (distCard) {
    if (distTotal > 0) {
      distCard.innerHTML = `
        <div class="gt-card-header">Grade Distribution</div>
        <div class="gt-dist-bar">
          ${Object.entries(dist).filter(([_, v]) => v > 0).map(([k, v]) => `
            <div class="gt-dist-seg" style="flex:${v};background:${distColors[k]}" title="${k}: ${v} (${Math.round((v / distTotal) * 100)}%)">
              <span>${k}</span>
            </div>
          `).join('')}
        </div>
        <span class="gt-dist-total">${distTotal} grades</span>
      `;
    } else {
      distCard.innerHTML = `
        <div class="gt-card-header">Grade Distribution</div>
        <p style="font-size:0.85rem;color:var(--slate-400);padding:0.5rem 0">Add courses to see your grade distribution</p>
      `;
    }
  }

  const activeCourses = state.semesters[state.activeSemester] || [];
  const activeGPA = calcGPA(activeCourses);
  const semCU = activeCourses.reduce((s, c) => s + c.creditUnits, 0);
  const semQP = activeCourses.reduce((s, c) => s + calcQualityPoints(c), 0);
  const allGPA = calcCGPA(state.semesters);
  const degree = getDegreeClass(allGPA);

  const statVals = document.querySelectorAll('.gt-card-stat-val');
  if (statVals.length >= 4) {
    statVals[0].textContent = formatGPA(activeGPA);
    statVals[1].textContent = activeCourses.length;
    statVals[2].textContent = semCU;
    statVals[3].textContent = semQP;
  }
  document.querySelectorAll('.gt-sem-btn').forEach(b => b.classList.toggle('active', b.dataset.semester === state.activeSemester));
  document.querySelectorAll('.gt-sem-btn').forEach(b => {
    const sem = b.dataset.semester;
    const gpa = getSemesterGPA(sem);
    const gpaEl = b.querySelector('.gt-sem-gpa');
    if (gpaEl) gpaEl.textContent = gpa !== null ? formatGPA(gpa) : '\u2014';
  });
}

/* ===== SETTINGS PAGE ===== */

  return `
    <div class="settings-section">
      <div class="settings-section-title">Profile</div>
      <div class="settings-row">
        <span class="settings-row-label">Name</span>
        <span class="settings-row-value">${user.name}</span>
      </div>
      <div class="settings-row">
        <span class="settings-row-label">Email</span>
        <span class="settings-row-value">${user.email}</span>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">Academic Info</div>
      <div class="settings-row">
        <span class="settings-row-label">University</span>
        <span class="settings-row-value">${state.school || 'Not set'}</span>
      </div>
      <div class="settings-row">
        <span class="settings-row-label">Department</span>
        <span class="settings-row-value">${state.department || 'Not set'}</span>
      </div>
      <div class="settings-row">
        <span class="settings-row-label">Current Semester</span>
        <span class="settings-row-value">${state.activeSemester}</span>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">Data</div>
      <div class="settings-row">
        <span class="settings-row-label">Courses Tracked</span>
        <span class="settings-row-value">${Object.values(state.semesters).flat().length}</span>
      </div>
      <div style="margin-top:1rem;display:flex;gap:0.75rem;flex-wrap:wrap">
        <button class="btn-logout" onclick="handleLogout()">${ICONS.logout} Sign Out</button>
      </div>
    </div>
  `;
}

function initSettingsPage() {}

/* ===== LOGOUT ===== */
function handleLogout() {
  clearState();
  navigate('landing');
}

/* ===== PAGE RENDERER ===== */
function renderPage() {
  const page = state.page;
  if (!page) return;

  if (page === 'landing') return renderLanding();
  if (page === 'signup') return renderSignup();
  if (page === 'login') return renderLogin();
  if (page === 'onboarding-school') return renderOnboardingSchool();
  if (page === 'onboarding-department') return renderOnboardingDepartment();
  if (page === 'dashboard') return renderDashboard();
}

/* ===== INIT ===== */
function init() {
  loadState();

  if (state.user) {
    if (!state.school) {
      state.page = 'onboarding-school';
    } else if (!state.department) {
      state.page = 'onboarding-department';
    } else {
      state.page = 'dashboard';
    }
  } else {
    state.page = 'landing';
  }

  renderPage();
}

init();

  </script>
